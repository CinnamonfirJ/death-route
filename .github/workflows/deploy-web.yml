name: Build and deploy Dead Route

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dead-route-pages-production
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  WRANGLER_VERSION: 4.161.0
  CLOUDFLARE_ACCOUNT_ID: d088a4356754db5a5c087e01f50af5fc
  WRANGLER_SEND_METRICS: 'false'

jobs:
  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24 for Wrangler
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure online rooms
        id: room_service
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ROOMS_API_TOKEN }}
          ROOM_SERVICE_URL: ${{ vars.DEAD_ROUTE_ROOM_SERVICE }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/room-service-deploy.ndjson
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes "wrangler@$WRANGLER_VERSION" deploy --config online-rooms/wrangler.toml
            service_url="$(python3 tools/configure_room_service.py --wrangler-output "$WRANGLER_OUTPUT_FILE_PATH")"
          elif [ -n "$ROOM_SERVICE_URL" ]; then
            service_url="$(python3 tools/configure_room_service.py --url "$ROOM_SERVICE_URL")"
          else
            echo "::warning::Online rooms are unavailable. Configure CLOUDFLARE_ROOMS_API_TOKEN or DEAD_ROUTE_ROOM_SERVICE to publish this build."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 "$service_url/rooms" |
            python3 -c 'import json, sys; sys.exit(0 if isinstance(json.load(sys.stdin).get("rooms"), list) else 1)'
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Install Godot and its matching Web template
        shell: bash
        run: |
          set -euo pipefail
          tag="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/$tag/Godot_v$tag"
          curl --fail --location --retry 3 "${base}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "${base}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${tag}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          template_dir="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_release.zip' -d "$template_dir"

      - name: Deploy the sign-in service
        if: steps.room_service.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ROOMS_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix wallet-bridge --omit=dev
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in Actions secrets to enable Google sign-in."
            npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wallet-bridge/wrangler.toml
          else
            secret_file="$(mktemp)"
            trap 'rm -f "$secret_file"' EXIT
            node -e 'const {GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET} = process.env; process.stdout.write(JSON.stringify({GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET}));' > "$secret_file"
            npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wallet-bridge/wrangler.toml --secrets-file "$secret_file"
          fi

      - name: Export the web game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --editor --import --quit
          godot --headless --export-release Web "$PWD/build/web/index.html"
          python3 tools/package_cloudflare_web.py build/web build/pages

      - name: Save the packaged Web build
        uses: actions/upload-artifact@v6
        with:
          name: dead-route-cloudflare
          path: build/pages/
          if-no-files-found: error
          retention-days: 7

      - name: Check Cloudflare credentials
        id: credentials
        env:
          TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "configured=$TOKEN_CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$TOKEN_CONFIGURED" != true ]; then
            echo "::warning::Build complete. Add the CLOUDFLARE_API_TOKEN Actions secret to enable deployment."
          fi

      - name: Publish to dead-route.pages.dev
        if: steps.credentials.outputs.configured == 'true' && steps.room_service.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/dead-route"
          status="$(curl --silent --show-error --retry 2 --max-time 20 --output /dev/null \
            --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$project_url/upload-token")"
          case "$status" in
            200) ;;
            401|403)
              echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN. Check that it has Account > Cloudflare Pages > Edit for the account that owns dead-route and allows requests from GitHub-hosted runners."
              exit 1
              ;;
            *)
              echo "::error::Cloudflare could not issue a Pages upload token (HTTP $status). Check the account, project, and Cloudflare service status."
              exit 1
              ;;
          esac
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy build/pages --project-name=dead-route --branch=main --commit-dirty=true
