[package]
name = "camp-commodities"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
resolver = "3"
description = "Death Route Camp Commodities: one NEP-245 multi-token contract for every camp market good."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.25"

[dev-dependencies]
near-sdk = { version = "5.25", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
